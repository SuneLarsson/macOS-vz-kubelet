---
# 1. The NFS Server Pod deployed to a normal Linux node.
apiVersion: v1
kind: Pod
metadata:
  name: macos-nfs-server
  namespace: <YOUR_NAMESPACE>
  labels:
    app.kubernetes.io/name: macos-nfs-server
spec:
  imagePullSecrets:
  - name: macos-robot-secret
  restartPolicy: Never
  securityContext:
    runAsUser: 1000
    fsGroup: 1000
  containers:
    - name: nfs-server
      image: <YOUR_NFS_SERVER_IMAGE>
      env:
        - name: SHARED_DIRECTORY
          value: /proj/<YOUR_NAMESPACE>
      ports:
        - name: nfs
          containerPort: 2049
      volumeMounts:
        - name: nfs-export
          mountPath: /proj/<YOUR_NAMESPACE>
      resources:
        requests:
          cpu: "4"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "4Gi"
  volumes:
    - name: nfs-export
      persistentVolumeClaim:
        claimName: <YOUR_PVC_NAME>

---
# 2. The Service to expose the NFS Pod
apiVersion: v1
kind: Service
metadata:
  name: macos-nfs-service
  namespace: <YOUR_NAMESPACE>
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: macos-nfs-server
  ports:
    - port: 2049
      targetPort: 2049
      nodePort: 32000

---
# 3. The Mac OS Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: vm-fio-benchmark
  namespace: <YOUR_NAMESPACE>
spec:
  backoffLimit: 0
  template:
    metadata:
      name: vm-fio-benchmark
      annotations:
        macos-vz-kubelet/nfs-service: "macos-nfs-service"
        macos-vz-kubelet/nfs-mount-path: "/proj/<YOUR_NAMESPACE>"
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: macos-robot-secret
      containers:
      - name: macos
        image: <YOUR_MACOS_IMAGE>
        imagePullPolicy: IfNotPresent
        command:
          - "/bin/sh"
          - "-c"
          - |
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            NFS_DIR="/Users/Shared/<YOUR_NAMESPACE>"
            
            # 1. Wait for NFS to be mounted by the postStart hook
            echo "Waiting for NFS mount at $NFS_DIR..."
            while ! mount | grep -q "$NFS_DIR"; do
              sleep 1
            done
            echo "NFS mounted successfully!"

            RESULTS_FILE="$NFS_DIR/fio_vm_benchmark_results_$(date +%Y-%m-%d-%H-%M).txt"
            
            echo "=== FIO NFS Storage Benchmark ===" | tee -a "$RESULTS_FILE"
            cd "$NFS_DIR"
            
            rm -f "$NFS_DIR"/seqwrite* "$NFS_DIR"/seqread* "$NFS_DIR"/randread*
            echo "--- 1. Sequential Write Test (Simulating Checkpoint Save) ---" | tee -a "$RESULTS_FILE"
            fio --name=seqwrite --ioengine=posixaio --direct=1 --rw=write --bs=1M --size=20G --numjobs=1 --iodepth=16 --directory="$NFS_DIR" | tee -a "$RESULTS_FILE"
            r
            m -f "$NFS_DIR"/seqwrite* "$NFS_DIR"/seqread* "$NFS_DIR"/randread*
            echo "--- 2. Sequential Read Test (Simulating Model Load) ---" | tee -a "$RESULTS_FILE"
            fio --name=seqread --ioengine=posixaio --direct=1 --rw=read --bs=1M --size=20G --numjobs=1 --iodepth=16 --directory="$NFS_DIR" | tee -a "$RESULTS_FILE"
            
            rm -f "$NFS_DIR"/seqwrite* "$NFS_DIR"/seqread* "$NFS_DIR"/randread*
            echo "--- 3. Random Read Test (Simulating Dataset Datalaoder) ---" | tee -a "$RESULTS_FILE"
            fio --name=randread --ioengine=posixaio --direct=1 --rw=randread --bs=4k --size=1G --numjobs=4 --iodepth=32 --directory="$NFS_DIR" | tee -a "$RESULTS_FILE"
            
            # Cleanup the temporary workload files generated by fio, but KEEP the results text file!
            rm -f "$NFS_DIR"/seqwrite* "$NFS_DIR"/seqread* "$NFS_DIR"/randread*
            
            echo "=== FIO Benchmark Completed ===" | tee -a "$RESULTS_FILE"
            echo "All results saved to: $RESULTS_FILE"

            # sleep 3600
            
        lifecycle:
          postStart:
             exec:
               command:
                 - "/bin/sh"
                 - "-c"
                 - |
                   NFS_DIR="/Users/Shared/<YOUR_NAMESPACE>"

                   if [ -z "$NFS_SERVER_IP" ] || [ -z "$NFS_NODEPORT" ]; then
                     echo "FAIL: NFS_SERVER_IP or NFS_NODEPORT not set"
                     exit 1
                   fi
                   
                   # Just the lightweight mount goes in the hook which guarantees it finishes in under the 10 seconds timeout.
                   sudo mkdir -p "$NFS_DIR"
                   sudo mount -t nfs -o vers=3,port="$NFS_NODEPORT",mountport="$NFS_NODEPORT",noresvport,noowners,rw,tcp "$NFS_SERVER_IP":/ "$NFS_DIR"

                   sleep 2
                   
        resources:
          requests:
            cpu: "10"
            memory: "12Gi"
          limits:
            cpu: "10"
            memory: "14Gi"
      tolerations:
      - key: "virtual-kubelet.io/provider"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/os: "darwin"